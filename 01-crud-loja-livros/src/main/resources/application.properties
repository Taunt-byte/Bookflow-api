spring.application.name=loja-livros
server.port=8080

# Banco H2 em memória (os dados somem quando a aplicação para)
spring.datasource.url=jdbc:h2:mem:lojadb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:lojadb)
spring.h2.console.enabled=true
