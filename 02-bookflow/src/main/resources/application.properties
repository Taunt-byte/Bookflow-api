spring.application.name=bookflow
server.port=8080

# Banco H2 em memória (os dados voltam ao inicial toda vez que a aplicação reinicia)
spring.datasource.url=jdbc:h2:mem:bookflow
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:bookflow)
spring.h2.console.enabled=true
